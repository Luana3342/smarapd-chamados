<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smarapd • Login</title>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
form{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 2px 12px #0001;width:300px;display:grid;gap:.8rem}
input,button{padding:.6rem;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}
button{background:#0f766e;color:#fff;border:0;cursor:pointer}
.msg{color:#b91c1c;font-size:.9rem}
</style></head><body>
<form method="post">
  <h2 style="margin:0">Smarapd • Chamados</h2>
  {% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
  <input name="usuario" placeholder="Usuário" required>
  <input name="senha" type="password" placeholder="Senha" required>
  <button>Entrar</button>
</form></body></html>
